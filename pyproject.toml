[project]
name = "feishu-gcal-sync"
version = "0.1.0"
description = "One-way mirror of a Feishu calendar into a Google Calendar secondary calendar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.30",
    "requests>=2.32",
    "tzdata>=2024.1",
]

[project.scripts]
fgs = "feishu_gcal_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
